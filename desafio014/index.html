<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 02</title>
    <style>
        body {
            background-color: hsl(35, 45%, 83%);
        }

        table {
            width: 500px;
            height: 500px;
            border-collapse: collapse;
            margin: auto;
            box-shadow: 1px 1px 3px #0000002f;
        }

        th {
            background-color: gray;
            color: #fff;
        }

        td, th {
            border: 1px solid #000;
            padding: 5px;
            font-family: arial;
        }

        th.manteresquerda {
            text-align: left;
            padding-left: 5px;
        }

        td.num {
            text-align: center;
        }

        th.exatashumanas {
            background-color: #fff;
            color: #000;
        }

        td.total{
            background-color: gray;
            color: #fff;
            text-align: center;
        }

        td {
            background-color: #fff;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2" scope="col">Área</th>
                <th rowspan="2" scope="col">Disciplinas</th>
                <th colspan="2" scope="colgroup">Notas
                <th rowspan="2" scope="col">Média</th>
            </tr>
            <tr>
                <th scope="col">Nota 1</th>
                <th scope="col">Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th class="exatashumanas" rowspan="4" scope="rowgroup">Exatas</th>
                <td>Matemática</td>
                <td class="num">10</td>
                <td class="num">10</td>
                <td class="num">10</td>
            </tr>
            <tr>
                <td>Física</td>
                <td class="num">10</td>
                <td class="num">10</td>
                <td class="num">10</td>
            </tr>
            <tr>
                <td>Química</td>
                <td class="num">10</td>
                <td class="num">10</td>
                <td class="num">10</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td class="num">10</td>
                <td class="num">10</td>
                <td class="num">10</td>
            </tr>
            <tr>
                <th colspan="4" class="manteresquerda" scope="row">Média de exatas</th>
                <td class="total">10</td>
            </tr>
            <tr>
                <th class="exatashumanas" rowspan="2" scope="rowgroup">Humanas</th>

                <td>História</td>
                <td class="num">10</td>
                <td class="num">10</td>
                <td class="num">10</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td class="num">10</td>
                <td class="num">10</td>
                <td class="num">10</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th colspan="4" class="manteresquerda" scope="row">Média de humanas</th>
                <td class="total">10</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
