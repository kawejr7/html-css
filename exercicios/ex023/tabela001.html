<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 400px;
            height: 400px;
            border-collapse: collapse;
            margin: auto;
        }

        tr {
            background-color: rgba(128, 128, 128, 0.785);
        }

        td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }

        .numero {
            text-align: right;
        }

    </style>
</head>
<body>
    <h1>Tabela</h1>
    <table>
        <tr>
            <td>A1</td>
            <td class="dinheiro">B1</td>
            <td>C1</td>
        </tr>
        <tr>
            <td>A2</td>
            <td class="dinheiro">B2</td>
            <td>C2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td class="dinheiro">B3</td>
            <td>C3</td>
        </tr>
        <tr>
            <td>A4</td>
            <td class="dinheiro">B4</td>
            <td>C4</td>
        </tr>
    </table>
</body>
</html>
